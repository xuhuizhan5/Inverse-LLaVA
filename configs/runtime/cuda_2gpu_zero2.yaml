id: cuda-2gpu-zero2
accelerator: cuda
mixed_precision: bf16
num_processes: 2
dataloader_workers: 8
distributed_strategy: deepspeed_zero2
attention_backend: sdpa
allow_tf32: true
deterministic_algorithms: false
cudnn_benchmark: false
cuda_allocator_conf: garbage_collection_threshold:0.75,expandable_segments:True
run_root: /workspace/runs
cache_root: /workspace/cache
tracker: tensorboard
hardware_telemetry_interval_seconds: 10
keep_last_checkpoints: 2
